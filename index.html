<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#16236e" />
    <script>
      // Anti-flash: fija el tema antes de pintar el CSS. Default SIEMPRE claro;
      // solo el valor explicito "dark" en localStorage da oscuro (misma regla que
      // resolveTheme en src/hooks/useTheme.ts). Una visita nueva o un storage
      // limpio quedan en claro aunque el SO prefiera oscuro.
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("sat-theme");
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
      })();
    </script>
    <meta
      name="description"
      content="Prototipo amigable del SAT Lima con consultas, pagos, tramites y asistente ciudadano."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://sat-redesign-hackathon.vercel.app/" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SAT Lima | Prototipo ciudadano" />
    <meta property="og:title" content="SAT Lima | Empieza con el dato que tienes" />
    <meta
      property="og:description"
      content="Consulta, paga y tramita con el SAT de Lima, con un asistente que te acompana en cada paso."
    />
    <meta property="og:url" content="https://sat-redesign-hackathon.vercel.app/" />
    <meta property="og:image" content="https://sat-redesign-hackathon.vercel.app/og.svg" />
    <meta property="og:locale" content="es_PE" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SAT Lima | Empieza con el dato que tienes" />
    <meta
      name="twitter:description"
      content="Consulta, paga y tramita con el SAT de Lima, con un asistente que te acompana en cada paso."
    />
    <meta name="twitter:image" content="https://sat-redesign-hackathon.vercel.app/og.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@500;600;700;800&display=swap"
    />
    <title>SAT Lima | Prototipo ciudadano</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
